name: Build Windows (MinGW)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "同时用 Inno Setup 打安装包（需要联网装 choco 包）"
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.10.3 (aqtinstall)
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.10.3 win64_mingw -O "D:/Qt" -m qtmultimedia qtshadertools qt5compat
          aqt install-tool windows desktop tools_mingw1310 -O "D:/Qt"
          aqt install-tool windows desktop tools_ninja -O "D:/Qt"
          echo "D:/Qt/6.10.3/mingw_64/bin" | Out-File -Append $env:GITHUB_PATH
          echo "D:/Qt/Tools/mingw1310_64/bin" | Out-File -Append $env:GITHUB_PATH
          echo "D:/Qt/Tools/Ninja" | Out-File -Append $env:GITHUB_PATH

      # MinGW GCC 13.1 + LTO：qt_add_qml_module 生成的 qmltyperegistrations 对象会以 LTO
      # 格式产出，ld 无法加载（"plugin needed to handle lto object"），最终
      # qml_register_types_QueMusic() 变成未定义引用、链接失败。CI 里关掉 LTO。
      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DQUEMUSIC_ENABLE_LTO=OFF `
            -DCMAKE_PREFIX_PATH="D:/Qt/6.10.3/mingw_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      # 项目在 CMake 里调了 qt_deploy_runtime()，Release 构建会把 Qt 运行库 / 插件直接部署到 build/bin，
      # 所以 build/bin 本身就是一个可运行的便携目录。这里只做校验，避免产出不可用的裸 exe。
      - name: Check deployment
        shell: pwsh
        run: |
          $bin = "build/bin"
          Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize
          if (-not (Test-Path "$bin/QueMusic.exe")) { throw "QueMusic.exe not found in $bin" }
          if (-not (Test-Path "$bin/Qt6Core.dll")) { throw "qt_deploy_runtime 没有把 Qt 运行库部署到 $bin" }
          $plugins = Get-ChildItem "$bin/qml" -ErrorAction SilentlyContinue
          if (-not $plugins) { throw "没有部署 qml 插件目录" }

      - name: Package portable zip
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "QueMusic-mingw-$sha"
          Copy-Item -Recurse "build/bin" $name
          Compress-Archive -Path "$name\*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Build installer (Inno Setup)
        if: ${{ inputs.package }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

          # Inno Setup 官方安装包不带中文语言包，QueMusic.iss 引用的 compiler:Languages\Chinese.isl
          # 并不存在，需先补齐（取自官方 issrc 仓库的简体中文翻译）。
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
            -OutFile "$langDir\Chinese.isl"

          & $iscc "/DBuildDir=$env:GITHUB_WORKSPACE\build\bin" "packaging\windows\QueMusic.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译安装包失败，exit=$LASTEXITCODE" }

          $exe = Get-ChildItem dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "dist 下没有生成安装包" }
          $exe | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QueMusic-windows-${{ github.sha }}
          path: |
            QueMusic-mingw-*.zip
            dist/*.exe
          if-no-files-found: warn
          retention-days: 14
